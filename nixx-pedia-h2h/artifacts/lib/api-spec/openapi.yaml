openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Felix Pedia H2H API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: user
    description: User operations
  - name: deposit
    description: Deposit operations
  - name: withdrawal
    description: Withdrawal operations
  - name: transaction
    description: Transaction history
  - name: dashboard
    description: Dashboard summary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username already taken

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  /api-keys/regenerate:
    post:
      operationId: regenerateApiKey
      tags: [user]
      summary: Regenerate API key
      responses:
        "200":
          description: New API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResult"

  /deposits/qris:
    post:
      operationId: createQrisDeposit
      tags: [deposit]
      summary: Create QRIS deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrisDepositInput"
      responses:
        "200":
          description: QRIS created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrisResult"

  /withdrawals:
    post:
      operationId: createWithdrawal
      tags: [withdrawal]
      summary: Request withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "200":
          description: Withdrawal requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transaction]
      summary: List transaction history
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    AuthCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6

    User:
      type: object
      required: [id, username, role, balance, apiKey, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        balance:
          type: number
        apiKey:
          type: string
        createdAt:
          type: string
          format: date-time

    ApiKeyResult:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string

    QrisDepositInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 1000

    QrisResult:
      type: object
      required: [success, qrData, transactionId]
      properties:
        success:
          type: boolean
        qrData:
          type: string
        transactionId:
          type: integer

    WithdrawalInput:
      type: object
      required: [amount, bankName, accountNumber, accountName]
      properties:
        amount:
          type: number
          minimum: 10000
        bankName:
          type: string
        accountNumber:
          type: string
        accountName:
          type: string

    Transaction:
      type: object
      required: [id, type, amount, status, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [deposit, withdrawal]
        amount:
          type: number
        status:
          type: string
          enum: [pending, success, failed]
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    DashboardSummary:
      type: object
      required: [balance, totalDeposit, totalWithdrawal, totalTransactions, pendingTransactions]
      properties:
        balance:
          type: number
        totalDeposit:
          type: number
        totalWithdrawal:
          type: number
        totalTransactions:
          type: integer
        pendingTransactions:
          type: integer
